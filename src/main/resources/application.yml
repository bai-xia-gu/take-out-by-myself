server:
  port: 8080
  servlet:
    context-path: /api/v1
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: take-out-backend
  profiles:
    active: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/takeout?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: root
    password: ""
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 2s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: always

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.baixiagu.takeout
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

takeout:
  jwt:
    secret: ${JWT_SECRET:zhisu-waimai-local-dev-secret-key-0123456789}
    expire-days: 30
  storage:
    root: ./uploads
    public-base: ${PUBLIC_BASE:http://127.0.0.1:8080}
  wechat:
    mock: true
    appid: ${WECHAT_APPID:}
    secret: ${WECHAT_SECRET:}
  ai:
    deepseek:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      model: deepseek-chat
      timeout-seconds: 60

logging:
  level:
    com.baixiagu.takeout: debug
